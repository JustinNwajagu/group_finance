# Firebase App Hosting — https://firebase.google.com/docs/app-hosting
# Connect this GitHub repo in the Firebase console (App Hosting → backend →
# live branch `main`, automatic rollouts). Secrets are created with:
#   firebase apphosting:secrets:set SECRET_NAME
# then referenced below (never commit real secret values).

runConfig:
  runtime: nodejs22

env:
  - variable: ADMIN_EMAIL
    value: klef2007.2013@gmail.com
    availability:
      - BUILD
      - RUNTIME

  # Web client (ok as secrets or console env — not privileged, but keep one source of truth)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  # Admin SDK (must be Secret Manager)
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - BUILD
      - RUNTIME

  # Public app origin for emails / reset continue URLs.
  - variable: APP_BASE_URL
    value: https://shsnklef13.com
    availability:
      - RUNTIME
  - variable: SESSION_IDLE_MINUTES
    value: "15"
    availability:
      - RUNTIME
