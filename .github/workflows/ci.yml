name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        env:
          # Placeholder values so `next build` can resolve config without real secrets.
          # Production secrets live in Firebase App Hosting / Secret Manager.
          ADMIN_EMAIL: klef2007.2013@gmail.com
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: klefapp.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: klefapp
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"
          FIREBASE_PROJECT_ID: klefapp
          FIREBASE_CLIENT_EMAIL: ci@klefapp.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: |
            -----BEGIN PRIVATE KEY-----
            CI_PLACEHOLDER
            -----END PRIVATE KEY-----
        run: npm run build
